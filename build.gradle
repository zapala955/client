plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds Mojang + Fabric repositories automatically.
}

loom {
	accessWidenerPath = file("src/main/resources/liquidclient.classtweaker")

	mods {
		"liquidclient" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	// Bundled font licences (Inter / Nunito: SIL OFL 1.1, Lucide icons: ISC + MIT, lyric faces: OFL 1.1 /
	// Apache 2.0) ship with the fonts.
	from("INTER-OFL.txt")
	from("NUNITO-OFL.txt")
	from("LYRIC-FONTS-LICENSES.txt")
	from("LUCIDE-LICENSE.txt")
	from("MATERIAL-SYMBOLS-LICENSE.txt")
	from("MATERIAL-SOUNDS-LICENSE.txt")
}
